<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <title>PDF Reader</title>

    <link rel="stylesheet" href="reader.css">
</head>

<body>

    <div id="toolbar">

        <button class="tbtn" id="btnSidebar" title="Toggle thumbnails" aria-label="Toggle thumbnails">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="7" height="16" rx="1"></rect>
                <line x1="14" y1="4" x2="21" y2="4"></line>
                <line x1="14" y1="10" x2="21" y2="10"></line>
                <line x1="14" y1="16" x2="21" y2="16"></line>
            </svg>
        </button>

        <div class="sep"></div>

        <div class="grp" id="pageBox">
            <button class="tbtn" id="btnPrev" title="Previous page">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <input id="pageInput" type="number" min="1" value="1">

            <span>/ <span id="pageTotal">-</span></span>

            <button class="tbtn" id="btnNext" title="Next page">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

        </div>

        <div class="sep hide-mobile"></div>

        <div class="grp hide-mobile">

            <button class="tbtn" id="btnZoomOut" title="Zoom out">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>

            <span id="zoomPct" title="Reset zoom">100%</span>

            <button class="tbtn" id="btnZoomIn" title="Zoom in">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>

            <button class="tbtn" id="btnFitWidth" title="Fit to width">
                <svg viewBox="0 0 24 24">
                    <polyline points="3 8 3 3 8 3"></polyline>
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <polyline points="8 21 3 21 3 16"></polyline>
                </svg>
            </button>

        </div>

        <span id="fname"></span>

        <span id="fsize"></span>

        <div class="spacer"></div>

        <button class="tbtn" id="btnFullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24">
                <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            </svg>
        </button>

        <button class="tbtn" id="btnDownload" title="Download">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>

    </div>

    <div id="body">

        <div id="sidebarBackdrop"></div>

        <div id="sidebar"></div>

        <div id="viewerWrap">
            <div id="dropZone">
                <svg viewBox="0 0 24 24">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <h2>Open a PDF to get started</h2>
                <p>Drag &amp; drop a PDF file anywhere on this page, or click below to browse.</p>
                <button class="openBtn" id="btnOpenBig">Choose PDF file</button>
            </div>

            <div id="scroller" style="display:none;">
                <div id="pages"></div>
            </div>

            <div id="loadOverlay">
                <div class="fname" id="ovFname"></div>
                <div class="ring">
                    <svg viewBox="0 0 56 56">
                        <circle class="bg" cx="28" cy="28" r="24"></circle>
                        <circle class="fg" id="ringFg" cx="28" cy="28" r="24" stroke-dasharray="150.8"
                            stroke-dashoffset="150.8"></circle>
                    </svg>
                    <div class="pct" id="ovPct">0%</div>
                </div>
                <div class="msg" id="ovMsg">Loading document…</div>
            </div>

            <div id="errBox"></div>

            <div id="pwOverlay">
                <div class="pwBox">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <h3>Password required</h3>
                    <p>This PDF is protected. Enter the password to open it.</p>
                    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
                    <div id="pwErrMsg"></div>
                    <div class="pwActions">
                        <button class="pwBtn secondary" id="pwCancel">Cancel</button>
                        <button class="pwBtn primary" id="pwSubmit">Unlock</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <input type="file" id="fileInput" accept="application/pdf,.pdf">

    <script type="module" src="reader.js"></script>
</body>

</html>
