<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="NIMCET Resources — a curated resource hub for NIMCET aspirants with books, notes, PYQs, videos, practice sets, formulas, Telegram communities and mock tests.">
    <meta name="keywords"
        content="NIMCET, NIMCET 2027, NIMCET preparation, NIMCET resources, NIMCET books, NIMCET notes, NIMCET PYQ, NIMCET previous year questions, NIMCET mock test, NIMCET practice, NIMCET Telegram, MCA entrance exam">
    <meta name="author" content="NIMCET Resources">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="color-scheme" content="dark">

    <title>NIMCET RESOURCES</title>

    <link rel="icon" type="image/png" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Mobile top bar -->
    <header class="topbar">
        <button class="icon-btn" id="menuToggle" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 5.5H17M3 10H17M3 14.5H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            </svg>
        </button>
        <span class="topbar-title" id="topbarTitle">Resource Hub</span>
        <span class="topbar-spacer"></span>
    </header>

    <!-- Sidebar overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <div class="shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">👨‍💻</span>
                <span class="brand-text">NIMCET <em>'27</em></span>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round">
                    </svg>
                </button>
            </div>

            <nav class="nav">
                <div class="nav-group">
                    <p class="nav-label">Overview</p>
                    <button class="nav-item" data-nav="home" data-active="true">
                        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M2 7.2 8 2l6 5.2M3.5 6.3V14h9V6.3" stroke="currentColor" stroke-width="1.4"
                                stroke-linecap="round" stroke-linejoin="round">
                        </svg>
                        <span>Home</span>
                    </button>
                    <button class="nav-item" data-nav="all">
                        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4">
                                <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4">
                                    <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor"
                                        stroke-width="1.4">
                                        <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor"
                                            stroke-width="1.4">
                        </svg>
                        <span>All Resources</span>
                    </button>
                </div>

                <div class="nav-group">
                    <p class="nav-label">Subjects</p>
                    <button class="nav-item" data-nav="subject" data-subject="Mathematics">
                        <span class="nav-symbol">&Sigma;</span>
                        <span>Mathematics</span>
                    </button>
                    <button class="nav-item" data-nav="subject" data-subject="Logical Reasoning">
                        <span class="nav-symbol">&rarr;</span>
                        <span>Logical Reasoning</span>
                    </button>
                    <button class="nav-item" data-nav="subject" data-subject="Computer">
                        <span class="nav-symbol">{ }</span>
                        <span>Computer</span>
                    </button>
                    <button class="nav-item" data-nav="subject" data-subject="Quantitative Aptitude">
                        <span class="nav-symbol">%</span>
                        <span>Quantitative Aptitude</span>
                    </button>
                    <button class="nav-item" data-nav="subject" data-subject="English">
                        <span class="nav-symbol">Aa</span>
                        <span>English</span>
                    </button>
                </div>


            </nav>

            <div class="sidebar-foot">
                <p>Built for NIMCET 2027 aspirants</p>
            </div>
        </aside>

        <main class="main" id="main">
            <!-- HOME VIEW -->
            <section class="view" id="view-home">
                <header class="view-head">
                    <h1>Resource Hub</h1>
                    <p class="subtitle">Books, notes, PYQs, videos and practice sets for NIMCET 2027 — organised by
                        subject.</p>
                </header>

                <section class="section">
                    <div class="subject-grid" id="subjectGrid"></div>
                </section>

                <section class="section">
                    <h2 class="section-title">Browse by type</h2>
                    <div class="chip-row" id="typeChips"></div>
                </section>

                <section class="section">
                    <h2 class="section-title">Featured</h2>
                    <div class="resource-grid" id="featuredGrid"></div>
                </section>
            </section>

            <!-- RESOURCES VIEW -->
            <section class="view" id="view-resources" hidden>
                <header class="view-head">
                    <h1 id="resourcesHeading">All Resources</h1>
                    <p class="subtitle" id="resourcesCount"></p>
                </header>

                <div class="toolbar">
                    <div class="search-field">
                        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" class="search-icon">
                            <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4">
                                <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search by title, chapter, topic..."
                            autocomplete="off">
                    </div>
                    <div class="filter-pills" id="filterPills"></div>
                </div>

                <div class="resource-grid" id="resourcesGrid"></div>
                <div class="empty-state" id="emptyState" hidden>
                    <p class="empty-title">No resources match</p>
                    <p class="empty-sub">Try a different search term or clear the active filter.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Mobile bottom tab bar -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="bnav-item" data-bottom="home" aria-label="Home">
            <svg width="19" height="19" viewBox="0 0 16 16" fill="none">
                <path d="M2 7.2 8 2l6 5.2M3.5 6.3V14h9V6.3" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round">
            </svg>
            <span>Home</span>
        </button>
        <button class="bnav-item" data-bottom="all" aria-label="All resources">
            <svg width="19" height="19" viewBox="0 0 16 16" fill="none">
                <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4" />
                <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4" />
                <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4" />
                <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <span>All</span>
        </button>
        <button class="bnav-item" data-bottom="search" aria-label="Search">
            <svg width="19" height="19" viewBox="0 0 15 15" fill="none">
                <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4">
                    <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>Search</span>
        </button>
        <button class="bnav-item" data-bottom="menu" aria-label="Subjects and menu">
            <svg width="19" height="19" viewBox="0 0 16 16" fill="none">
                <path d="M3 5.5H13M3 8H13M3 10.5H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            </svg>
            <span>Subjects</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>

</html>
